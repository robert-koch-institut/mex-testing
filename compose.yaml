services:
  mex-testing:
    build:
      context: .
    ports:
      - 8050:8050
    environment:
      - MEX_TESTING_HTTP_SERVER_HOST=0.0.0.0
    healthcheck:
      test: [ "CMD", "curl", "http://0.0.0.0:8050/v0/_system/check" ]
      interval: 60s
      timeout: 5s
      retries: 5
    volumes:
      - data:/app/data
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest@sha256:46f719fd3457d4e7e8e5845fe00c35c20e7bae7ff1e8b9fe595f2a81029f5ba8
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-MEx_testing1234}
    ports:
      - 1433:1433
    volumes:
      - mssql:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  sql-testing-seed:
    build:
      context: .
      dockerfile: sql-testing-seed.Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - MEX_TESTING_SQL_SEED_HOST=mssql
      - MEX_TESTING_SQL_SEED_SA_PASSWORD=${MSSQL_SA_PASSWORD:-MEx_testing1234}
    restart: "no"
volumes:
  data:
  mssql:
